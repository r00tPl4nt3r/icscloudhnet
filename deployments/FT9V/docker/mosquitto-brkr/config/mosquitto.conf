listener 1883
# Default listener for local access (anonymous)
persistence true
allow_anonymous true
persistence_location /mosquitto/data/

# Enable logging
log_dest stdout
#Log verbosity 
log_type error
log_type warning
log_type notice
log_type information
log_type debug
connection_messages true
log_timestamp true


# Listener for Internet or external access (authenticated)
listener 1884
allow_anonymous false
password_file /mosquitto/config/password.txt
