#Global configuration for Mosquitto broker
persistence true
persistence_location /mosquitto/data/

# Enable logging
log_dest stdout
#Log verbosity 
log_type error
log_type warning
log_type notice
log_type information
log_type debug
connection_messages true
log_timestamp true

per_listener_settings true

# Default listener for local access (anonymous)
listener 1883
allow_anonymous true

# Listener for Internet or external access (authenticated)
listener 1884
allow_anonymous false
password_file /mosquitto/config/password.txt

