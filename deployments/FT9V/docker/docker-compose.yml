services:
  mosquitto-brkr:
    image: eclipse-mosquitto
    hostname: ft-broker
    container_name: mosquitto9v
    restart: unless-stopped
    network_mode: host
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto-brkr/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto-brkr/config/password.txt:/mosquitto/config/password.txt
  mqtt-pub:
    image: eclipse-mosquitto:latest
    command: sh -c "mosquitto_pub -h ft-broker -t test -m 'Hello World'"
    network_mode: host
    depends_on:
      - mosquitto-brkr
  mqtt-sub:
    image: eclipse-mosquitto:latest
    command: sh -c "mosquitto_sub -h ft-broker -t test -u admin -P password"
    network_mode: host
    depends_on:
      - mosquitto-brkr
  red-node-ui:
    image: ft/ft-ui:latest
    container_name: ft_ui_mqtt9v
    restart: unless-stopped
    network_mode: host
    ports:
      - 1880:1880
    volumes:
      - ./ft-ui/data/flows.json:/data/flows.json
  ft-sensor:
    image: ft/ft-sensor
    container_name: ft-sensor9v
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./ft-sensor/data/:/user/app/src/data
  
  nginx-proxy-ft9v:
    image: nginx:latest
    container_name: nginx_proxy_ft9v
    restart: unless-stopped
    network_mode: host
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/log:/var/log/nginx
    depends_on:
      - red-node-ui

  cowrie_mqtt:
    image: cowrie/cowrie:latest
    container_name: cowrie_mqtt9v
    restart: unless-stopped
    network_mode: host
    mounts:
      type: bind
      source: ./cowrie/cowrie_ui
      target: /cowrie/cowrie-git/etc
      

  cowrie_ui:
    image: cowrie/cowrie:latest
    container_name: cowrie_ui9v
    restart: unless-stopped
    network_mode: host
    mounts:
      type: bind
      source: ./cowrie/cowrie_ui
      target: /cowrie/cowrie-git/etc



